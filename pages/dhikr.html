<!-- 📄 pages/dhikr.html -->
<div class="container" style="padding-top: var(--space-4); padding-bottom: calc(var(--space-8) + 60px);">
    
    <!-- Header -->
    <header style="margin-bottom: var(--space-4);">
        <h2 class="text-xl font-bold text-primary">Dhikr & Dua</h2>
        <p class="text-sm text-tertiary" style="margin-top: 4px;">Lutje nga Kurani dhe Sunneti</p>
    </header>

    <!-- Shiriti i Kërkimit (Search Bar) -->
    <div class="input-group" style="position: relative; margin-bottom: var(--space-5);">
        <i data-lucide="search" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-text-tertiary); width: 20px;"></i>
        <input type="text" id="dua-search" class="input" placeholder="Kërko lutje..." style="padding-left: 44px; background-color: var(--color-bg-elevated); border-radius: var(--radius-full); border: 1px solid var(--color-border);">
    </div>

    <!-- Të Zgjedhurat (Favorites) - Karusel Horizontal -->
    <div style="margin-bottom: var(--space-6);">
        <div class="flex-between" style="margin-bottom: var(--space-3);">
            <h3 class="font-bold text-base">Të zgjedhurat</h3>
        </div>
        
        <div id="favorites-carousel" style="display: flex; gap: var(--space-3); overflow-x: auto; padding-bottom: var(--space-2); scrollbar-width: none; -webkit-overflow-scrolling: touch;">
            <!-- Mbushet automatikisht nga JS kur shton lutje -->
        </div>
    </div>

    <!-- Kategoritë (Grid 2x2) -->
    <h3 class="font-bold text-base" style="margin-bottom: var(--space-3);">Kategoritë</h3>
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3);">
        
        <a href="#/dhikr/kategori/1" class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-4) var(--space-2); text-align: center; text-decoration: none; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
            <div style="background: rgba(251, 191, 36, 0.1); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-3);">
                <i data-lucide="sunrise" style="width: 24px; color: var(--color-accent-gold);"></i>
            </div>
            <h4 class="font-bold text-sm text-primary" style="margin-bottom: 4px;">Mëngjes & Mbrëmje</h4>
            <p class="text-xs text-tertiary">30 lutje</p>
        </a>

        <a href="#/dhikr/kategori/2" class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-4) var(--space-2); text-align: center; text-decoration: none; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
            <div style="background: rgba(16, 185, 129, 0.1); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-3);">
                <i data-lucide="home" style="width: 24px; color: #10B981;"></i>
            </div>
            <h4 class="font-bold text-sm text-primary" style="margin-bottom: 4px;">Shtëpia & Familja</h4>
            <p class="text-xs text-tertiary">15 lutje</p>
        </a>

        <a href="#/dhikr/kategori/3" class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-4) var(--space-2); text-align: center; text-decoration: none; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
            <div style="background: rgba(59, 130, 246, 0.1); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-3);">
                <i data-lucide="plane" style="width: 24px; color: #3B82F6;"></i>
            </div>
            <h4 class="font-bold text-sm text-primary" style="margin-bottom: 4px;">Udhëtim</h4>
            <p class="text-xs text-tertiary">8 lutje</p>
        </a>

        <a href="#/dhikr/kategori/4" class="card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-4) var(--space-2); text-align: center; text-decoration: none; background: var(--color-bg-elevated); border: 1px solid var(--color-border); border-radius: var(--radius-lg);">
            <div style="background: rgba(245, 158, 11, 0.1); width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-3);">
                <i data-lucide="coffee" style="width: 24px; color: #F59E0B;"></i>
            </div>
            <h4 class="font-bold text-sm text-primary" style="margin-bottom: 4px;">Ushqim & Pije</h4>
            <p class="text-xs text-tertiary">10 lutje</p>
        </a>

    </div>
</div>
