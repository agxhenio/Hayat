<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kur'ani Fisnik - Hayat</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .quran-header-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        .select-input {
            width: 100%;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            background-color: var(--color-bg-secondary);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            font-weight: 500;
        }
        .view-modes {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-4);
        }
        .view-modes::-webkit-scrollbar {
            display: none;
        }
        .mode-btn {
            padding: var(--space-2) var(--space-3);
            border-radius: var(--radius-full);
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            font-size: var(--font-size-xs);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mode-btn--active {
            background-color: var(--color-accent-teal);
            color: white;
            border-color: var(--color-accent-teal);
        }
        .quran-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-4);
        }
        .verse-card {
            border-left: 3px solid transparent;
            transition: border-color 0.2s;
            position: relative;
        }
        .verse-card--active {
            border-left-color: var(--color-accent-gold) !important;
            background-color: rgba(var(--color-accent-gold-rgb), 0.05);
        }
        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 1.8rem;
            line-height: 2.8rem;
            text-align: right;
            direction: rtl;
            color: var(--color-text-primary);
            margin-bottom: var(--space-2);
            padding-left: var(--space-4); /* Hapësirë për butonin e bookmark-ut */
        }
        .translation-text {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            line-height: 1.5;
        }
        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
        }
        .verse-number {
            font-size: var(--font-size-xs);
            color: var(--color-accent-gold);
            font-weight: bold;
        }
        .bookmark-btn {
            background: none;
            border: none;
            color: var(--color-text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            transition: all 0.2s;
        }
        .bookmark-btn:hover {
            color: var(--color-accent-gold);
            background-color: var(--color-bg-secondary);
        }
        .bookmark-btn--saved {
            color: var(--color-accent-gold) !important;
        }
        .bismillah {
            font-family: 'Amiri', serif;
            font-size: 2rem;
            text-align: center;
            margin: var(--space-4) 0;
            color: var(--color-accent-gold);
        }
        /* Kartela e vazhdimit të leximit */
        .resume-card {
            background: linear-gradient(135deg, var(--color-accent-teal), #0f5c5c);
            color: white;
            margin-bottom: var(--space-4);
            display: none; /* Do të shfaqet me JS vetëm nëse ka progres */
        }
    </style>
</head>
<body>
    <header class="page-header" style="padding: var(--space-4) var(--space-4) var(--space-2) var(--space-4);">
        <h1 class="page-title">Kur'ani Fisnik</h1>
        <p class="page-subtitle">Lexo, Mëso dhe Medito</p>
    </header>

    <main class="page-content" style="padding-bottom: 100px;">
        
        <!-- Kartela "Vazhdo Leximin" -->
        <div class="card card--padding-md resume-card" id="resume-reading-card">
            <div style="display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);">
                <i data-lucide="bookmark" style="width: 18px; height: 18px;"></i>
                <span style="font-size: var(--font-size-xs); font-weight: bold; text-transform: uppercase;">Vazhdo Leximin</span>
            </div>
            <h3 id="resume-title" style="font-size: var(--font-size-md); font-weight: 600; margin-bottom: 4px;">Sura --</h3>
            <p id="resume-subtitle" style="font-size: var(--font-size-xs); opacity: 0.8; margin-bottom: var(--space-3);">Ajeti --</p>
            <button class="btn btn--secondary btn--sm" id="resume-btn" style="background: white; color: var(--color-accent-teal); width: auto;">
                Shko tek Ajeti
            </button>
        </div>

        <!-- Kontrollet e përzgjedhjes -->
        <div class="quran-header-controls">
            <select id="sura-select" class="select-input">
                <option value="">Duke ngarkuar suret...</option>
            </select>
        </div>

        <!-- Butonat e Modaliteteve të Shikimit -->
        <div class="view-modes">
            <button class="mode-btn mode-btn--active" data-mode="parallel">Arabisht + Shqip</button>
            <button class="mode-btn" data-mode="arabic">Vetëm Arabisht</button>
            <button class="mode-btn" data-mode="albanian">Vetëm Shqip</button>
            <button class="mode-btn" data-mode="focus">Modaliteti Fokus</button>
        </div>

        <!-- Bismillah -->
        <div id="bismillah-container" class="bismillah" style="display: none;">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
        </div>

        <!-- Zona e leximit -->
        <div class="quran-container" id="verses-container">
            <div class="card card--padding-md" style="text-align: center;">
                <p style="color: var(--color-text-muted);">Zgjidh një sure për të filluar leximin...</p>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="../index.html" class="bottom-nav__item">
            <i data-lucide="home"></i> <span>Shtëpia</span>
        </a>
        <a href="prayer.html" class="bottom-nav__item">
            <i data-lucide="clock"></i> <span>Namazi</span>
        </a>
        <a href="quran.html" class="bottom-nav__item bottom-nav__item--active">
            <i data-lucide="book-open"></i> <span>Kur'an</span>
        </a>
        <a href="mburoja.html" class="bottom-nav__item">
            <i data-lucide="shield"></i> <span>Mburoja</span>
        </a>
        <a href="settings.html" class="bottom-nav__item">
            <i data-lucide="settings"></i> <span>Settings</span>
        </a>
    </nav>

    <script src="../js/modules/quran.js"></script>
</body>
</html>
