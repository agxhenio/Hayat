<div class="page-container" id="qibla-page" style="padding-bottom: 80px; display: none; min-height: 100vh; flex-direction: column;">
    
    <header style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px;">
        <button id="btn-back-qibla" style="background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0;">
            ←
        </button>
        <div>
            <h1 style="font-size: 20px; font-weight: 700; color: white; margin: 0;">Kibla</h1>
            <p style="font-size: 14px; color: #9CA3AF; margin: 4px 0 0 0;">Gjej drejtimin e Qabes</p>
        </div>
    </header>

    <div style="text-align: center; margin-bottom: 40px;">
        <p id="qibla-status" style="color: #3B82F6; font-size: 16px; font-weight: 600; margin: 0;">Kërkon qasje te sensorët...</p>
        <p id="qibla-instruction" style="color: #9CA3AF; font-size: 13px; margin: 8px 0 0 0;">Lëvizni telefonin në formën e numrit 8 për të kalibruar busullën nëse është e nevojshme.</p>
    </div>

    <div style="flex: 1; display: flex; justify-content: center; align-items: center; position: relative;">
        <div id="compass-container" style="width: 280px; height: 280px; border-radius: 50%; border: 4px solid #374151; background: #1C2431; position: relative; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.1s ease-out;">
            
            <div style="position: absolute; top: 12px; font-weight: bold; color: #EF4444; font-size: 18px;">N</div>
            <div style="position: absolute; bottom: 12px; font-weight: bold; color: #9CA3AF; font-size: 14px;">S</div>
            <div style="position: absolute; right: 12px; font-weight: bold; color: #9CA3AF; font-size: 14px;">E</div>
            <div style="position: absolute; left: 12px; font-weight: bold; color: #9CA3AF; font-size: 14px;">W</div>
            
            <div style="width: 12px; height: 12px; background: white; border-radius: 50%; z-index: 10; box-shadow: 0 0 10px rgba(255,255,255,0.5);"></div>

            <div id="qibla-pointer" style="position: absolute; width: 4px; height: 140px; background: transparent; top: 0; transform-origin: bottom center; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 5; transition: transform 0.3s ease;">
                <div style="width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 16px solid #10B981; margin-top: -8px;"></div>
                <div style="width: 4px; height: 50px; background: #10B981;"></div>
                <div style="background: #1C2431; border: 2px solid #10B981; padding: 6px; border-radius: 50%; margin-top: -15px; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);">
                    <span style="font-size: 24px; line-height: 1;">🕋</span>
                </div>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 40px;">
        <div style="background: #1C2431; padding: 16px; border-radius: 12px; border: 1px solid #374151; text-align: center;">
            <p style="color: #9CA3AF; font-size: 13px; margin: 0 0 4px 0;">Këndi i Kiblës</p>
            <p style="color: white; font-size: 20px; font-weight: bold; margin: 0;" id="qibla-degree">--°</p>
        </div>
        <div style="background: #1C2431; padding: 16px; border-radius: 12px; border: 1px solid #374151; text-align: center; display: flex; flex-direction: column; justify-content: center;">
            <p style="color: #9CA3AF; font-size: 13px; margin: 0 0 4px 0;">Vendndodhja</p>
            <p style="color: white; font-size: 14px; font-weight: bold; margin: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;" id="qibla-location">--</p>
        </div>
    </div>

    <button id="btn-start-compass" style="width: 100%; padding: 16px; background: #3B82F6; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 24px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
        📍 Fillo Busullën
    </button>

</div>
