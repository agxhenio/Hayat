<!-- 📄 index.html -->
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0B131E">
    <title>Hayat - Islamic Life Manager</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <!-- Këtu injektohet përmbajtja e faqeve nga router.js -->
    <main id="app-view" class="animate-fade-in"></main>

    <!-- Menuja e Poshtme (Fixed Shell) -->
    <nav class="bottom-nav">
        <a href="#/" class="bottom-nav__item is-active" data-route="/">
            <i data-lucide="activity"></i>
            <span>Kryefaqja</span>
        </a>
        <a href="#/namazi" class="bottom-nav__item" data-route="/namazi">
            <i data-lucide="clock"></i>
            <span>Namazi</span>
            <div class="bottom-nav__badge">0</div>
        </a>
        <a href="#/kurani" class="bottom-nav__item" data-route="/kurani">
            <i data-lucide="book-open"></i>
            <span>Kurani</span>
        </a>
        <a href="#/dhikr" class="bottom-nav__item" data-route="/dhikr">
            <i data-lucide="circle-dot"></i>
            <span>Dhikr</span>
        </a>
        <a href="#/menu" class="bottom-nav__item" data-route="/menu">
            <i data-lucide="more-horizontal"></i>
            <span>Menu</span>
        </a>
    </nav>

    <!-- Global Bottom Sheet (Këtu do luhen videot/podcastet) -->
    <div class="modal-overlay" id="global-overlay"></div>
    <div class="bottom-sheet" id="global-bottom-sheet">
        <div class="sheet-handle"></div>
        <div id="bottom-sheet-content"></div>
    </div>

    <!-- Core App Logic -->
    <script type="module" src="js/app.js"></script>
    <script src="js/modules/prayer.js"></script>
    
</body>
</html>
