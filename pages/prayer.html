<div class="page-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
        <div>
            <h1 style="font-size: 24px; font-weight: 700; color: var(--color-text-primary); margin: 0;">Namazi</h1>
            <p style="font-size: 14px; color: var(--color-text-secondary); margin: 4px 0 0 0;">Shtylla e fesë</p>
        </div>
    </header>

    <div class="prayer-hero">
        <div class="prayer-progress-circle">
            <div class="prayer-progress-inner">
                <span class="prayer-current-label">Deri në Ikindinë</span>
                <h2 class="prayer-countdown">- 00:00:00</h2>
                <span class="prayer-current-time">Koha aktuale: Dreka</span>
            </div>
        </div>
    </div>

    <div class="prayer-list">
        <div class="prayer-card" onclick="window.openPrayerSheet('Sabahu')">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sunrise"></i></div>
                <div class="prayer-info">
                    <h3>Sabahu</h3>
                    <p>05:25</p>
                </div>
            </div>
            <div class="prayer-status" id="status-Sabahu"></div>
        </div>

        <div class="prayer-card" onclick="window.openPrayerSheet('Dreka')">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sun"></i></div>
                <div class="prayer-info">
                    <h3>Dreka</h3>
                    <p>12:46</p>
                </div>
            </div>
            <div class="prayer-status" id="status-Dreka"></div>
        </div>

        <div class="prayer-card" onclick="window.openPrayerSheet('Ikindia')">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="cloud-sun"></i></div>
                <div class="prayer-info">
                    <h3>Ikindia</h3>
                    <p>16:45</p>
                </div>
            </div>
            <div class="prayer-status" id="status-Ikindia"></div>
        </div>

        <div class="prayer-card" onclick="window.openPrayerSheet('Akshami')">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sunset"></i></div>
                <div class="prayer-info">
                    <h3>Akshami</h3>
                    <p>19:36</p>
                </div>
            </div>
            <div class="prayer-status" id="status-Akshami"></div>
        </div>

        <div class="prayer-card" onclick="window.openPrayerSheet('Jacia')">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="moon"></i></div>
                <div class="prayer-info">
                    <h3>Jacia</h3>
                    <p>21:12</p>
                </div>
            </div>
            <div class="prayer-status" id="status-Jacia"></div>
        </div>
    </div>

    <div id="prayer-action-sheet" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;">
        <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);" onclick="window.closePrayerSheet()"></div>
        
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; background: #1C2431; border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 24px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s ease-out;" id="sheet-content">
            <div style="width: 40px; height: 4px; background: #374151; border-radius: 2px; margin: 0 auto 16px auto;"></div>
            <h3 id="action-sheet-title" style="text-align: center; margin: 0 0 16px 0; font-size: 18px; color: #FFFFFF;">Regjistro Namazin</h3>
            
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button onclick="window.registerPrayer('Në xhami')" style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #2A3441; border: 1px solid #374151; border-radius: 12px; color: #FFFFFF; font-size: 16px; text-align: left; width: 100%;">
                    <span>🕌</span> Në xhami me xhemat
                </button>
                <button onclick="window.registerPrayer('Në shtëpi')" style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #2A3441; border: 1px solid #374151; border-radius: 12px; color: #FFFFFF; font-size: 16px; text-align: left; width: 100%;">
                    <span>👨‍👦</span> Në shtëpi me xhemat
                </button>
                <button onclick="window.registerPrayer('Vetëm')" style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #2A3441; border: 1px solid #374151; border-radius: 12px; color: #FFFFFF; font-size: 16px; text-align: left; width: 100%;">
                    <span>🧎</span> Vetëm
                </button>
            </div>
        </div>
    </div>
</div>
