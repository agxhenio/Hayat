<div class="page-container" id="prayer-stats-page" style="padding-bottom: 80px; display: none; min-height: 100vh; flex-direction: column;">
    
    <header style="display: flex; align-items: center; gap: 16px; margin-bottom: 24px;">
        <button id="btn-back-stats" style="background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0;">
            ←
        </button>
        <div>
            <h1 style="font-size: 20px; font-weight: 700; color: white; margin: 0;">Statistikat</h1>
            <p style="font-size: 14px; color: #9CA3AF; margin: 4px 0 0 0;">Progresi i adhurimit tënd</p>
        </div>
    </header>

    <section style="background: linear-gradient(135deg, #10B981, #059669); border-radius: 16px; padding: 24px; text-align: center; color: white; margin-bottom: 24px; border: 1px solid #34D399; box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);">
        <div style="font-size: 40px; margin-bottom: 8px;">🔥</div>
        <h2 style="font-size: 40px; font-weight: 800; margin: 0; line-height: 1;" id="stats-streak-count">0</h2>
        <p style="font-size: 16px; font-weight: 600; margin: 8px 0 0 0;">Ditë radhazi</p>
        <p style="font-size: 13px; opacity: 0.9; margin: 8px 0 0 0;">Mos e shkëput lidhjen me Allahun!</p>
    </section>

    <section style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
        <div style="background: #1C2431; padding: 20px; border-radius: 12px; border: 1px solid #374151; text-align: center;">
            <div style="font-size: 24px; margin-bottom: 8px;">🕌</div>
            <h3 style="font-size: 28px; font-weight: 700; color: white; margin: 0;" id="stats-total-prayers">0</h3>
            <p style="font-size: 13px; color: #9CA3AF; margin: 4px 0 0 0;">Namaze të falura</p>
        </div>
        
        <div style="background: #1C2431; padding: 20px; border-radius: 12px; border: 1px solid #374151; text-align: center;">
            <div style="font-size: 24px; margin-bottom: 8px;">📿</div>
            <h3 style="font-size: 28px; font-weight: 700; color: white; margin: 0;" id="stats-total-sunnah">0</h3>
            <p style="font-size: 13px; color: #9CA3AF; margin: 4px 0 0 0;">Sunete të falura</p>
        </div>
    </section>

    <section style="background: #1C2431; border-radius: 12px; border: 1px solid #374151; padding: 20px; margin-bottom: 24px;">
        <h3 style="font-size: 16px; font-weight: 600; color: white; margin: 0 0 16px 0;">Detajet e Faljes</h3>
        
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 20px;">🕌</span>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-size: 14px; color: white;">Në Xhami</span>
                        <span style="font-size: 14px; color: #9CA3AF;" id="stat-mosque-count">0</span>
                    </div>
                    <div style="width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 4px;">
                        <div id="stat-mosque-bar" style="width: 0%; background: #3B82F6; height: 100%; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 20px;">👨‍👦</span>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-size: 14px; color: white;">Shtëpi (Xhemat)</span>
                        <span style="font-size: 14px; color: #9CA3AF;" id="stat-jamaah-count">0</span>
                    </div>
                    <div style="width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 4px;">
                        <div id="stat-jamaah-bar" style="width: 0%; background: #10B981; height: 100%; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 20px;">🧎</span>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-size: 14px; color: white;">Vetëm</span>
                        <span style="font-size: 14px; color: #9CA3AF;" id="stat-alone-count">0</span>
                    </div>
                    <div style="width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 4px;">
                        <div id="stat-alone-bar" style="width: 0%; background: #8B5CF6; height: 100%; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 20px;">⏰</span>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-size: 14px; color: white;">Kaza (Vonesë)</span>
                        <span style="font-size: 14px; color: #9CA3AF;" id="stat-qada-count">0</span>
                    </div>
                    <div style="width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 4px;">
                        <div id="stat-qada-bar" style="width: 0%; background: #F59E0B; height: 100%; border-radius: 4px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</div>
