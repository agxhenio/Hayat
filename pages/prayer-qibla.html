<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kibla - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/prayer.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .compass-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 40vh;
            position: relative;
            margin-top: var(--space-4);
        }
        .compass-ring {
            width: 260px;
            height: 260px;
            border: 4px solid var(--color-border-strong);
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background: radial-gradient(circle, var(--color-bg-tertiary) 0%, var(--color-bg-secondary) 100%);
            box-shadow: var(--shadow-md);
        }
        .compass-arrow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-accent-gold);
            width: 40px;
            height: 40px;
        }
        .kaaba-icon {
            font-size: 4rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
        }
        .compass-info {
            text-align: center;
            margin-top: var(--space-8);
        }
        .calibration-msg {
            font-size: var(--font-size-xs);
            color: var(--color-text-muted);
            margin-top: var(--space-2);
            font-style: italic;
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <button class="btn btn--icon-only" onclick="history.back()" aria-label="Kthehu">
                <i data-lucide="arrow-left"></i>
            </button>
            <h1 class="page-title" style="font-size: var(--font-size-xl);">Drejtimi i Kibles</h1>
            <div style="width: 24px;"></div> <!-- Spacer për balancim -->
        </div>
    </header>

    <main class="page-content animate-fade-in">
        <div class="card card--padding-lg">
            <div class="compass-container">
                <div class="compass-ring" id="compass-ring">
                    <i data-lucide="navigation" class="compass-arrow" fill="currentColor"></i>
                    <div class="kaaba-icon">🕋</div>
                </div>
            </div>

            <div class="compass-info">
                <h2 class="arabic-text tabular-nums" style="color: var(--color-accent-gold); font-size: 2.5rem;" id="qibla-degree">--°</h2>
                <p class="page-subtitle" id="qibla-status">Kërkohet leja e orientimit</p>
                <button class="btn btn--primary" id="btn-calibrate" style="margin-top: var(--space-4); width: 100%;">
                    <i data-lucide="compass"></i> Fillo Kalibrimin / Lejo
                </button>
                <p class="calibration-msg" id="calibration-msg" style="display: none;">Lëvizni telefonin në formë 8 për saktësi maksimale.</p>
            </div>
        </div>
        
        <div class="card card--padding-md" style="margin-top: var(--space-4);">
            <div class="list-item__left">
                <i data-lucide="map-pin" class="list-item__icon"></i>
                <div class="list-item__info">
                    <span class="list-item__title">Vendndodhja Aktuale</span>
                    <span class="list-item__subtitle" id="location-info">Tiranë, Shqipëri</span>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/modules/prayer-qibla.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
