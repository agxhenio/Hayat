<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayat - Design System Preview</title>
    <!-- Thërrasim stilin kryesor që mbledh të gjithë komponentët -->
    <link rel="stylesheet" href="css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { padding: var(--space-4); }
        section { margin-bottom: var(--space-10); }
        h2 { margin-bottom: var(--space-4); border-bottom: 1px solid var(--color-divider); padding-bottom: var(--space-2); }
        .demo-group { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    </style>
</head>
<body>

    <h1>Design System Preview</h1>
    <button class="btn btn--ghost" onclick="toggleTheme()" style="margin-bottom: var(--space-4);">🌓 Ndërro Temën (Light/Dark)</button>

    <section>
        <h2>Butonat</h2>
        <div class="demo-group">
            <button class="btn btn--primary btn--md">Primary Gold</button>
            <button class="btn btn--secondary btn--md">Secondary Teal</button>
            <button class="btn btn--ghost btn--md">Ghost</button>
        </div>
    </section>

    <section>
        <h2>Karta (Cards)</h2>
        <div class="card card--padding-md" style="margin-bottom: var(--space-3);">
            <h3>Default Card</h3>
            <p>Kjo është një kartë standarte me padding dhe border të rrumbullakosur.</p>
        </div>
        <div class="card card--gradient card--padding-md">
            <h3>Gradient Card</h3>
            <p>Përdoret për namazin e radhës ose njoftime të rëndësishme.</p>
        </div>
    </section>

    <section>
        <h2>Badges</h2>
        <div class="demo-group">
            <span class="badge badge--success">Kompletuar</span>
            <span class="badge badge--warning">Në pritje</span>
            <span class="badge badge--danger">Humbur</span>
            <span class="badge badge--gold">Sunet</span>
        </div>
    </section>

    <section>
        <h2>Ikonat</h2>
        <div class="demo-group">
            <i data-lucide="sun"></i>
            <i data-lucide="moon"></i>
            <i data-lucide="book-open"></i>
            <i data-lucide="shield"></i>
        </div>
    </section>

    <script>
        // Funksioni për të ndërruar temën
        function toggleTheme() {
            const root = document.documentElement;
            const current = root.getAttribute('data-theme');
            root.setAttribute('data-theme', current === 'light' ? 'dark' : 'light');
        }
        
        // Inicializimi i ikonave
        lucide.createIcons();
    </script>
</body>
</html>
