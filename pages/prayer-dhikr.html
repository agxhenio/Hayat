<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dhikri - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/prayer.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dhikr-session">
    <header class="page-header">
        <button class="btn btn--icon-only" onclick="window.location.href='prayer.html'">
            <i data-lucide="x"></i>
        </button>
        <div class="progress-bar-container" style="width: 50%; height: 4px;">
            <div class="progress-bar-fill" id="dhikr-progress" style="width: 0%;"></div>
        </div>
        <span id="dhikr-step-count" style="font-size: var(--font-size-xs);">1 / 8</span>
    </header>

    <main class="page-content" style="align-items: center; justify-content: center; min-height: 80vh;">
        <div id="dhikr-card" class="card card--padding-lg animate-scale-in" style="width: 100%; text-align: center;">
            <p class="page-subtitle" id="dhikr-title" style="margin-bottom: var(--space-2);">Dhikri 1/8</p>
            <h2 class="arabic-text" id="dhikr-arabic" style="margin: var(--space-4) 0;">...</h2>
            <p class="page-subtitle" id="dhikr-latin" style="margin-bottom: var(--space-2); font-style: italic;"></p>
            <p id="dhikr-translation" style="margin-bottom: var(--space-4);"></p>

            <div class="counter-container" style="margin-top: var(--space-6);">
                <button class="btn btn--primary btn--lg" id="btn-count" style="font-size: 2rem; height: 120px; width: 120px; border-radius: 50%;">
                    0
                </button>
                <p class="page-subtitle" style="margin-top: var(--space-2);" id="dhikr-target">nga 3</p>
            </div>
        </div>
    </main>

    <script src="../js/modules/prayer-dhikr.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
