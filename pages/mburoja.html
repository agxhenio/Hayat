<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mburoja - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/mburoja.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .search-container {
            position: sticky;
            top: 0;
            background-color: var(--color-bg-primary);
            padding: var(--space-3) var(--space-4);
            z-index: var(--z-sticky);
            border-bottom: 1px solid var(--color-divider);
        }
        
        .favorites-section {
            margin-top: var(--space-4);
            padding: 0 var(--space-4);
        }
        
        .favorites-scroll {
            display: flex;
            gap: var(--space-3);
            overflow-x: auto;
            padding-bottom: var(--space-2);
            margin: 0 calc(var(--space-4) * -1);
            padding: 0 var(--space-4) var(--space-3) var(--space-4);
        }
        
        .favorite-card {
            min-width: 140px;
            background-color: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            transition: background-color var(--transition-fast);
        }
        
        .favorite-card:active {
            background-color: var(--color-bg-elevated);
        }
        
        .favorite-card__icon {
            color: var(--color-accent-gold);
            width: 24px;
            height: 24px;
        }
        
        .favorite-card__title {
            font-size: var(--font-size-sm);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-2);
            padding: var(--space-4);
            padding-bottom: calc(var(--space-20) + var(--safe-area-bottom));
        }
    </style>
</head>
<body>
    <header class="page-header" style="position: static;">
        <div class="header-content">
            <div>
                <h1 class="page-title">Mburoja</h1>
                <p class="page-subtitle">Lutjet e Besimtarit</p>
            </div>
            <button class="btn btn--icon-only" aria-label="Cilësimet">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i data-lucide="search" class="search-box__icon"></i>
            <input type="text" class="form-input search-box__input" id="search-dua" placeholder="Kërko lutje...">
        </div>
    </div>

    <main class="page-content" style="padding-top: 0;">
        <!-- Të Zgjedhurat (Favorites) -->
        <section class="favorites-section animate-slide-up">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-3);">
                <h3 style="font-size: var(--font-size-base);">⭐ Të Zgjedhurat</h3>
                <a href="#" style="font-size: var(--font-size-xs);">Shiko të gjitha →</a>
            </div>
            
            <div class="favorites-scroll no-scrollbar" id="favorites-container">
                <!-- Mbushet dinamikisht nga JS. Placeholder për momentin -->
                <div class="favorite-card" onclick="window.location.href='mburoja-dua.html?id=dua_hasbunallah'">
                    <i data-lucide="heart" class="favorite-card__icon" fill="currentColor"></i>
                    <span class="favorite-card__title">Kur ke ankth dhe shqetësim</span>
                </div>
            </div>
        </section>

        <!-- Kategoritë -->
        <section class="animate-slide-up" style="animation-delay: 0.1s;">
            <div style="padding: 0 var(--space-4); margin-top: var(--space-2);">
                <h3 style="font-size: var(--font-size-base);">📋 Kategoritë</h3>
            </div>
            
            <div class="categories-grid" id="categories-container">
                <!-- Lista e kategorive injektohet nga mburoja.js -->
            </div>
        </section>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/modules/mburoja.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
