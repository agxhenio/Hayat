<!-- pages/mburoja-dua.html -->
<div class="mburoja-dua-page animate-scale-in" style="padding: var(--space-4); padding-top: calc(var(--space-4) + env(safe-area-inset-top)); min-height: 100vh; background-color: var(--color-bg-primary); position: fixed; inset: 0; z-index: var(--z-toast); display: flex; flex-direction: column;">
  
  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
    <button class="btn btn--ghost btn--icon btn-back-to-category" style="border-radius: var(--radius-full);">
      <i data-lucide="chevron-left"></i>
    </button>
    <button id="btn-toggle-favorite" class="btn btn--ghost btn--icon" style="border-radius: var(--radius-full);">
      <i data-lucide="heart"></i>
    </button>
  </header>

  <!-- Sticky Top Counter -->
  <div class="card card--elevated" style="padding: var(--space-3) var(--space-4); margin-bottom: var(--space-6); display: flex; justify-content: space-between; align-items: center; position: sticky; top: var(--space-2); z-index: 10; border: 1px solid var(--color-border);">
    <div style="display: flex; align-items: center; gap: var(--space-3);">
      <i data-lucide="book" style="color: var(--color-text-tertiary);"></i>
      <span id="dua-progress-text" style="font-weight: var(--font-weight-bold); font-size: var(--font-size-lg); font-variant-numeric: tabular-nums;">0 / 1</span>
    </div>
    <i id="dua-check-icon" data-lucide="check-circle" style="color: var(--color-text-tertiary);"></i>
  </div>

  <div style="flex: 1; overflow-y: auto; padding-bottom: calc(var(--space-20) * 2);" class="no-scrollbar">
    
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-6);">
      <h1 id="dua-title" style="font-size: var(--font-size-2xl); color: var(--color-accent-gold); max-width: 80%;">Titulli</h1>
      <div class="badge badge--gold" id="dua-repeat-badge">1x</div>
    </div>

    <p id="dua-context" style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-6); font-style: italic;"></p>

    <!-- Content Card -->
    <div class="card card--elevated" id="dua-tap-area" style="padding: var(--space-6) var(--space-4); margin-bottom: var(--space-6); cursor: pointer; transition: transform 0.1s ease; border: 2px solid transparent;">
      <p id="dua-arabic" class="arabic-quran" style="font-size: var(--font-size-ar-lg); text-align: center; line-height: var(--line-height-arabic); margin-bottom: var(--space-8); direction: rtl;"></p>
      <p id="dua-transliteration" style="font-size: var(--font-size-lg); color: var(--color-text-secondary); text-align: center; font-style: italic; margin-bottom: var(--space-6);"></p>
      <p id="dua-translation" style="font-size: var(--font-size-xl); color: var(--color-text-primary); margin-bottom: var(--space-2); line-height: var(--line-height-relaxed);"></p>
    </div>

    <!-- Virtue Card -->
    <div id="dua-virtue-card" style="background-color: hsla(var(--h-accent-teal), var(--s-accent-teal), var(--l-accent-teal), 0.1); border-left: 4px solid var(--color-accent-teal); padding: var(--space-4); border-radius: 0 var(--radius-md) var(--radius-md) 0; margin-bottom: var(--space-6);">
      <p style="font-size: var(--font-size-sm); color: var(--color-accent-teal); font-weight: bold; margin-bottom: var(--space-1);">Virtyti</p>
      <p id="dua-virtue" style="font-size: var(--font-size-sm); color: var(--color-text-primary); font-style: italic; margin: 0;"></p>
    </div>

    <!-- Reference -->
    <p style="font-size: var(--font-size-xs); color: var(--color-text-tertiary); text-align: center;">
      📚 Burimi: <span id="dua-source"></span>
    </p>

  </div>
</div>
