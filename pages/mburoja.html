<div class="mburoja-page animate-fade-in" style="padding: var(--space-4); padding-top: calc(var(--space-4) + env(safe-area-inset-top));">
  
  <header style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-6);">
    <div>
      <h1 style="font-size: var(--font-size-3xl); margin-bottom: var(--space-1);">Mburoja 🛡️</h1>
      <p style="color: var(--color-text-secondary);">Lutjet e Besimtarit</p>
    </div>
  </header>

  <div class="input-group" style="margin-bottom: var(--space-6);">
    <div class="input-wrapper">
      <i data-lucide="search" class="input-icon"></i>
      <input type="text" id="mburoja-search" class="input input--with-icon" placeholder="Kërko lutje ose situatë...">
    </div>
  </div>

  <section style="margin-bottom: var(--space-8);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
      <h2 style="font-size: var(--font-size-lg);">Të Zgjedhurat ⭐</h2>
    </div>
    
    <!-- Horizontal Scroll Favorites -->
    <div id="mburoja-favorites-container" class="no-scrollbar" style="display: flex; overflow-x: auto; gap: var(--space-4); padding-bottom: var(--space-2);">
      <!-- Injected via JS -->
    </div>
  </section>

  <section>
    <h2 style="font-size: var(--font-size-lg); margin-bottom: var(--space-4);">Kategoritë 📋</h2>
    <div id="mburoja-categories-list" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <!-- Injected via JS -->
      <div style="text-align: center; padding: var(--space-6);"><div class="spinner--islamic" style="margin:0 auto;"></div></div>
    </div>
  </section>

</div>
