<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Kur'ani - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/quran.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <header class="page-header">
        <div class="header-content">
            <div>
                <h1 class="page-title">Kur'ani Fisnik</h1>
                <div class="surah-selector-container">
                    <select id="surah-select" class="select-control">
                        <option value="1">1. Al-Fatihah</option>
                    </select>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn btn--icon-only" id="quran-settings-toggle" aria-label="Cilësimet e Leximit">
                    <i data-lucide="sliders"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="page-content" style="padding-bottom: 110px;">
        
        <section id="quran-settings-panel" class="card card--padding-md settings-panel hidden animate-fade-in">
            <h3 style="font-size: var(--font-size-sm); color: var(--color-accent-teal); margin-bottom: var(--space-3);">Cilësimet e leximit</h3>
            
            <div class="setting-row">
                <span>Madhësia e shkrimit arab</span>
                <div class="font-controls">
                    <button class="btn btn--secondary btn--sm" id="btn-font-decrease">A-</button>
                    <button class="btn btn--secondary btn--sm" id="btn-font-increase">A+</button>
                </div>
            </div>

            <div class="setting-row" style="margin-top: var(--space-3);">
                <span>Shfaq përkthimin shqip</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-translation" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </section>

        <section class="card card--padding-lg quran-container">
            <div id="bismillah-container" class="bismillah-text">
                بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
            </div>
            
            <div id="quran-verses-container" class="quran-verses-flow">
                <div class="loading-spinner">Duke ngarkuar suren...</div>
            </div>
        </section>

        <div class="quran-navigation-controls">
            <button id="btn-prev-surah" class="btn btn--secondary">
                <i data-lucide="chevron-left"></i> Sura e kaluar
            </button>
            <button id="btn-next-surah" class="btn btn--secondary">
                Sura tjetër <i data-lucide="chevron-right"></i>
            </button>
        </div>

        <button id="btn-ask-gemini" class="btn btn--primary gemini-ai-btn" style="margin-top: var(--space-3);">
            <i data-lucide="sparkles"></i> Shpjegimi i sures me AI (Tefsiri)
        </button>

    </main>

    <nav class="bottom-nav">
        <a href="../index.html" class="bottom-nav__item">
            <i data-lucide="home"></i> <span>Shtëpia</span>
        </a>
        <a href="prayer.html" class="bottom-nav__item">
            <i data-lucide="clock"></i> <span>Namazi</span>
        </a>
        <a href="quran.html" class="bottom-nav__item bottom-nav__item--active">
            <i data-lucide="book-open"></i> <span>Kur'an</span>
        </a>
        <a href="mburoja.html" class="bottom-nav__item">
            <i data-lucide="shield"></i> <span>Mburoja</span>
        </a>
        <a href="settings.html" class="bottom-nav__item">
            <i data-lucide="settings"></i> <span>Settings</span>
        </a>
    </nav>

    <script src="../js/services/quran-service.js"></script>
    <script src="../js/modules/quran.js"></script>
</body>
</html>
