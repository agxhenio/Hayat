<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dhikri - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="page-header">
        <h1 class="page-title">Dhikri</h1>
        <p class="page-subtitle">Përmendja e Allahut</p>
    </header>

    <main class="page-content">
        <section class="card card--gradient card--padding-md" style="margin-bottom: var(--space-4);">
            <h3 class="list-item__title">Numërues i Lirë</h3>
            <p class="list-item__subtitle">Përdore për çdo dhikër</p>
            <button class="btn btn--primary" style="margin-top: var(--space-3);" onclick="window.location.href='dhikr-free.html'">Hap Numëruesin</button>
        </section>

        <section id="dhikr-categories">
            <!-- Kategoritë: Mëngjes, Mbrëmje, Para Gjumi -->
            <div class="list-item" onclick="window.location.href='dhikr-session.html?type=morning'">
                <div class="list-item__left">
                    <i data-lucide="sun"></i>
                    <div>
                        <div class="list-item__title">Dhikri i Mëngjesit</div>
                        <div class="list-item__subtitle">Pas sabahut</div>
                    </div>
                </div>
            </div>
            <div class="list-item" onclick="window.location.href='dhikr-session.html?type=evening'">
                <div class="list-item__left">
                    <i data-lucide="moon"></i>
                    <div>
                        <div class="list-item__title">Dhikri i Mbrëmjes</div>
                        <div class="list-item__subtitle">Pas ikindisë/akshamit</div>
                    </div>
                </div>
            </div>
            <div class="list-item" onclick="window.location.href='dhikr-session.html?type=bedtime'">
                <div class="list-item__left">
                    <i data-lucide="bed-double"></i>
                    <div>
                        <div class="list-item__title">Dhikri para Gjumit</div>
                        <div class="list-item__subtitle">Para fjetjes</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
