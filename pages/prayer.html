<div class="page-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4);">
        <div>
            <h1 style="font-size: 24px; font-weight: 700; color: var(--color-text-primary); margin: 0;">Namazi</h1>
            <p style="font-size: 14px; color: var(--color-text-secondary); margin: 4px 0 0 0;">Shtylla e fesë</p>
        </div>
    </header>

    <div class="prayer-hero">
        <div class="prayer-progress-circle">
            <div class="prayer-progress-inner">
                <span class="prayer-current-label">Deri në Ikindinë</span>
                <h2 class="prayer-countdown">- 00:00:00</h2>
                <span class="prayer-current-time">Koha aktuale: Dreka</span>
            </div>
        </div>
    </div>

    <div class="prayer-list">
        <div class="prayer-card" data-prayer="Sabahu">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sunrise"></i></div>
                <div class="prayer-info">
                    <h3>Sabahu</h3>
                    <p>05:25</p>
                </div>
            </div>
            <div class="prayer-status"></div>
        </div>

        <div class="prayer-card" data-prayer="Dreka">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sun"></i></div>
                <div class="prayer-info">
                    <h3>Dreka</h3>
                    <p>12:46</p>
                </div>
            </div>
            <div class="prayer-status"></div>
        </div>

        <div class="prayer-card" data-prayer="Ikindia">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="cloud-sun"></i></div>
                <div class="prayer-info">
                    <h3>Ikindia</h3>
                    <p>16:45</p>
                </div>
            </div>
            <div class="prayer-status"></div>
        </div>

        <div class="prayer-card" data-prayer="Akshami">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="sunset"></i></div>
                <div class="prayer-info">
                    <h3>Akshami</h3>
                    <p>19:36</p>
                </div>
            </div>
            <div class="prayer-status"></div>
        </div>

        <div class="prayer-card" data-prayer="Jacia">
            <div class="prayer-card-left">
                <div class="prayer-icon-wrapper"><i data-lucide="moon"></i></div>
                <div class="prayer-info">
                    <h3>Jacia</h3>
                    <p>21:12</p>
                </div>
            </div>
            <div class="prayer-status"></div>
        </div>
    </div>

    <div id="prayer-action-sheet" class="bottom-sheet" aria-hidden="true">
        <div class="bottom-sheet-overlay" data-close-sheet></div>
        <div class="bottom-sheet-content">
            <div class="bottom-sheet-header">
                <div class="bottom-sheet-drag"></div>
                <h3 id="action-sheet-title" style="text-align: center; margin: 0; font-size: 18px;">Regjistro Namazin</h3>
            </div>
            <div class="bottom-sheet-body" style="padding: var(--space-4);">
                <p style="text-align: center; color: var(--color-text-secondary); margin-bottom: var(--space-4);">Si e fale këtë namaz?</p>
                <div class="prayer-options-list">
                    <button class="prayer-option-btn" data-method="mosque">
                        <span class="option-icon">🕌</span>
                        <span class="option-text">Në xhami me xhemat</span>
                    </button>
                    <button class="prayer-option-btn" data-method="home">
                        <span class="option-icon">👨‍👦</span>
                        <span class="option-text">Në shtëpi me xhemat</span>
                    </button>
                    <button class="prayer-option-btn" data-method="alone">
                        <span class="option-icon">🧎</span>
                        <span class="option-text">Vetëm</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
