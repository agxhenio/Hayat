<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Namazi - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/prayer.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <div>
                <h1 class="page-title">Namazi</h1>
                <p class="page-subtitle">Shtylla e fesë <span id="hijri-date-display">• ...</span></p>
            </div>
            <button class="btn btn--icon-only" aria-label="Cilësimet">
                <i data-lucide="settings"></i>
            </button>
        </div>
    </header>

    <main class="page-content">
        <!-- Hero Card: Namazi Aktual / i Ardhshëm -->
        <section class="card card--gradient card--padding-lg hero-prayer-card animate-fade-in">
            <div class="hero-header">
                <span class="badge badge--gold" id="hero-status-badge">☀️ KOHA AKTUALE</span>
            </div>
            <div class="hero-main">
                <h2 class="prayer-name-large" id="hero-prayer-name">...</h2>
                <div class="prayer-time-large tabular-nums" id="hero-prayer-time">--:--</div>
            </div>
            <div class="hero-countdown">
                <p class="countdown-text">⏳ Mbeten <strong id="hero-countdown-timer" class="tabular-nums">--:--:--</strong></p>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="hero-progress-fill" style="width: 0%;"></div>
                </div>
            </div>
            <div class="hero-actions">
                <button class="btn btn--primary" id="btn-mark-prayed">
                    <i data-lucide="check-circle"></i> U fala
                </button>
            </div>
        </section>

        <!-- Timeline Horizontale e 5 Namazeve -->
        <section class="prayer-timeline no-scrollbar animate-slide-up">
            <div class="timeline-container" id="prayer-timeline-container">
                <!-- Këtu injektohen nga JS 5 kartat e namazeve -->
            </div>
        </section>

        <!-- Progresi ditor -->
        <section class="card card--padding-md animate-slide-up" style="animation-delay: 0.1s;">
            <div class="list-item__left" style="margin-bottom: var(--space-3);">
                <i data-lucide="bar-chart-2" class="list-item__icon"></i>
                <h3 class="list-item__title">Progresi i Sotëm</h3>
            </div>
            <div class="daily-progress-text">
                <strong><span id="daily-prayers-count">0</span>/5</strong> namaze
            </div>
            <div class="progress-bar-container" style="margin-bottom: var(--space-4);">
                <div class="progress-bar-fill bg-success" id="daily-progress-fill" style="width: 0%;"></div>
            </div>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span>🔥 Streak</span>
                    <strong id="stat-streak">0 ditë</strong>
                </div>
                <div class="stat-item">
                    <span>🕌 Në xhami</span>
                    <strong id="stat-mosque">0/0</strong>
                </div>
                <div class="stat-item">
                    <span>📿 Sunete</span>
                    <strong id="stat-sunnah">0/0</strong>
                </div>
            </div>
        </section>

        <!-- Veprimet e Shpejta -->
        <div class="quick-actions-grid animate-slide-up" style="animation-delay: 0.2s;">
            <button class="card card--padding-sm quick-action-btn" onclick="window.location.href='prayer-qibla.html'">
                <i data-lucide="compass"></i>
                <span>Kibla</span>
            </button>
            <button class="card card--padding-sm quick-action-btn" onclick="window.location.href='prayer-calendar.html'">
                <i data-lucide="calendar"></i>
                <span>Kalendar</span>
            </button>
            <button class="card card--padding-sm quick-action-btn" onclick="window.location.href='prayer-stats.html'">
                <i data-lucide="pie-chart"></i>
                <span>Stat.</span>
            </button>
        </div>
    </main>

    <script src="../js/services/prayer-times.js"></script>
    <script src="../js/modules/prayer.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
