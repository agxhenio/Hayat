<div class="container" style="padding-top: var(--space-4); padding-bottom: calc(var(--space-8) + 60px);">
    
    <header class="flex-between" style="margin-bottom: var(--space-6);">
        <a href="#/" class="btn btn--icon btn--secondary" style="text-decoration: none;">
            <i data-lucide="arrow-left" style="width: 20px; height: 20px; color: var(--color-text-primary);"></i>
        </a>
        
        <h2 class="text-lg font-bold">Të rejat & Kurset</h2>
        
        <div style="width: 36px; height: 36px;"></div>
    </header>

    <div style="display: flex; gap: var(--space-2); overflow-x: auto; margin-bottom: var(--space-5); padding-bottom: var(--space-2); scrollbar-width: none; -webkit-overflow-scrolling: touch;">
        <span class="badge badge--teal" style="padding: 6px 12px; font-size: 14px;">Të gjitha</span>
        <span class="badge badge--dark" style="padding: 6px 12px; font-size: 14px;">Kurse</span>
        <span class="badge badge--dark" style="padding: 6px 12px; font-size: 14px;">Podcast</span>
        <span class="badge badge--dark" style="padding: 6px 12px; font-size: 14px;">Video</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-3);">
        
        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-bg-secondary), var(--color-bg-tertiary)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="play-circle" style="width: 32px; height: 32px; color: var(--color-accent-teal);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Histori të Profetëve</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">15 min</p>
            </div>
        </div>
        
        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-accent-teal-dark), var(--color-bg-tertiary)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="book" style="width: 32px; height: 32px; color: var(--color-text-primary);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Kurse Texhvidi</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">8 Mësime</p>
            </div>
        </div>

        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-fajr), var(--color-bg-tertiary)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="headphones" style="width: 32px; height: 32px; color: var(--color-text-primary);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Podcast Islamik</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">Seria 1</p>
            </div>
        </div>

        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-accent-gold-dark), var(--color-bg-tertiary)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="heart" style="width: 32px; height: 32px; color: var(--color-text-primary);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Edukimi i Vetes</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">Pastrimi i zemrës</p>
            </div>
        </div>

        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-bg-secondary), var(--color-bg-primary)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="mic" style="width: 32px; height: 32px; color: var(--color-accent-teal);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Hutbe e Xhumasë</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">Tiranë</p>
            </div>
        </div>
        
        <div class="card" style="padding: 0; border: none; overflow: hidden;">
            <div style="height: 100px; background: linear-gradient(45deg, var(--color-bg-tertiary), var(--color-accent-teal-alpha)); display: flex; align-items: center; justify-content: center;">
                <i data-lucide="video" style="width: 32px; height: 32px; color: var(--color-text-primary);"></i>
            </div>
            <div style="padding: var(--space-3);">
                <h4 class="font-semibold text-sm">Tefsir Kurani</h4>
                <p class="text-xs text-tertiary" style="margin-top: 4px;">Surja Kehf</p>
            </div>
        </div>

    </div>
</div>
