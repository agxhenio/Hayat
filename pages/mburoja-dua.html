<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lutja - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/mburoja.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header class="page-header" style="position: sticky; top: 0; background: var(--color-bg-primary); z-index: var(--z-sticky);">
        <div class="header-content">
            <button class="btn btn--icon-only" onclick="history.back()" aria-label="Kthehu">
                <i data-lucide="arrow-left"></i>
            </button>
            <div style="flex-grow: 1; text-align: center; margin: 0 var(--space-3);">
                <h2 class="page-title" style="font-size: var(--font-size-lg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" id="dua-title">Lutja</h2>
            </div>
            <button class="btn btn--icon-only" id="btn-favorite" aria-label="Shto te të preferuarat">
                <i data-lucide="heart"></i>
            </button>
        </div>
    </header>

    <!-- Shirley i numëruesit progresiv në krye -->
    <div style="background-color: var(--color-bg-elevated); padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--color-divider); display: flex; align-items: center; justify-content: space-between;">
        <span class="badge badge--gold" id="dua-repeat-badge">1x</span>
        <div style="display: flex; gap: var(--space-2); align-items: center;">
            <strong id="dua-counter" class="tabular-nums" style="font-size: var(--font-size-lg);">0</strong>
            <span style="color: var(--color-text-muted);">/ <span id="dua-target">1</span></span>
        </div>
        <i data-lucide="check-circle" id="dua-complete-icon" style="color: var(--color-text-muted);"></i>
    </div>

    <main class="page-content">
        <div class="card card--padding-lg" style="text-align: center; border-left: 4px solid var(--color-accent-gold);">
            
            <!-- Butoni i Audios (Opsional) -->
            <div style="display: flex; justify-content: flex-end; margin-bottom: var(--space-2);">
                <button class="badge badge--default" style="border: none;" id="btn-audio">
                    <i data-lucide="play" style="width: 14px; height: 14px; margin-right: 4px;"></i> Dëgjo
                </button>
            </div>

            <!-- Arabishtja -->
            <h1 class="arabic-text" id="dua-arabic" style="font-size: var(--font-size-arabic-lg); margin-bottom: var(--space-5);">...</h1>
            
            <!-- Transliterimi -->
            <p id="dua-transliteration" style="font-size: var(--font-size-md); font-style: italic; color: var(--color-accent-gold); margin-bottom: var(--space-4);"></p>
            
            <hr>

            <!-- Përkthimi Shqip -->
            <p id="dua-translation" style="font-size: var(--font-size-lg); font-weight: var(--font-weight-medium); color: var(--color-text-primary); text-align: left; margin-top: var(--space-4);"></p>
        </div>

        <!-- Vlera (Virtue) nëse ka -->
        <div class="card card--padding-md" id="dua-virtue-card" style="margin-top: var(--space-4); background-color: rgba(13, 148, 136, 0.1); border: 1px solid rgba(13, 148, 136, 0.2);">
            <div style="display: flex; gap: var(--space-3); align-items: flex-start;">
                <i data-lucide="info" style="color: var(--color-accent-teal); flex-shrink: 0;"></i>
                <p id="dua-virtue" style="font-size: var(--font-size-sm); font-style: italic; color: var(--color-text-secondary);"></p>
            </div>
        </div>

        <!-- Burimi i Hadithit -->
        <p id="dua-source" style="font-size: var(--font-size-xs); color: var(--color-text-muted); text-align: center; margin-top: var(--space-5);"></p>
        
        <!-- Butoni i Madh i Numërimit -->
        <button class="btn btn--primary btn--lg" id="btn-count-dua" style="width: 100%; margin-top: var(--space-6); height: 60px; font-size: var(--font-size-lg);">
            Numëro (+1)
        </button>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/modules/dua-detail.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
