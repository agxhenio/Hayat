<div class="page-container" id="prayer-dhikr-page" style="padding-bottom: 40px; display: none; min-height: 100vh; flex-direction: column;">
  
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 0; margin-bottom: 16px;">
    <button id="btn-close-dhikr" style="background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; padding: 0; width: 40px; text-align: left;">
      ✕
    </button>
    <div style="text-align: center;">
      <h1 style="font-size: 18px; font-weight: 700; color: white; margin: 0;">Dhikri pas Namazit</h1>
      <p style="font-size: 14px; color: #9CA3AF; margin: 4px 0 0 0;" id="dhikr-progress-text">1 / 8</p>
    </div>
    <div style="width: 40px;"></div>
  </header>
  
  <div style="width: 100%; background: #1C2431; height: 6px; border-radius: 4px; margin-bottom: 40px; overflow: hidden;">
    <div id="dhikr-progress-fill" style="width: 12.5%; background: #3B82F6; height: 100%; border-radius: 4px; transition: width 0.3s ease;"></div>
  </div>
  
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 24px; margin-bottom: 40px;">
    
    <div id="dhikr-content-container" style="width: 100%; padding: 0 16px;">
      <p style="font-size: 36px; font-weight: bold; color: white; margin: 0 0 24px 0; line-height: 1.6;" id="dhikr-arabic" dir="rtl">
        أَسْتَغْفِرُ اللَّهَ
      </p>
      
      <p style="font-size: 18px; color: #9CA3AF; margin: 0 0 16px 0; font-style: italic;" id="dhikr-latin">
        Estagfirullah
      </p>
      
      <p style="font-size: 16px; color: white; margin: 0 0 24px 0; line-height: 1.5;" id="dhikr-translation">
        Kërkoj falje nga Allahu
      </p>
      
      <div style="display: inline-block; background: rgba(59, 130, 246, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(59, 130, 246, 0.2);">
        <span style="font-size: 13px; color: #60A5FA;" id="dhikr-source">Muslim, 591</span>
      </div>
    </div>
    
  </div>
  
  <div style="margin-top: auto; padding-top: 24px; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 16px;">
    <p style="color: #9CA3AF; font-size: 14px; margin: 0;">
      Përsërit edhe <strong style="color: white; font-size: 18px;" id="dhikr-remaining">3</strong> herë
    </p>
    
    <button id="btn-tap-dhikr" style="width: 140px; height: 140px; border-radius: 50%; background: #1D4ED8; border: 8px solid #3B82F6; color: white; font-size: 40px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4); transition: transform 0.1s ease, background-color 0.2s;" aria-label="Numëro dhikrin">
      <span id="dhikr-count">0</span>
    </button>
  </div>
  
</div>
