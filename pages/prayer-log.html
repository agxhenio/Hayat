<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Regjistro Namazin - Hayat</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/pages/prayer.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Stile specifike për format e regjistrimit */
        .log-option {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4);
            border: 2px solid var(--color-border);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-3);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .log-option:has(input:checked) {
            border-color: var(--color-accent-gold);
            background-color: rgba(201, 168, 76, 0.05);
        }
        .log-option input[type="radio"], .sunnah-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--color-accent-gold);
        }
        .sunnah-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-3);
            padding: var(--space-3) 0;
            border-bottom: 1px solid var(--color-divider);
        }
        .sunnah-info h4 { margin-bottom: 4px; }
        .hadith-quote {
            margin-top: var(--space-3);
            padding: var(--space-3);
            background-color: var(--color-bg-elevated);
            border-left: 3px solid var(--color-accent-teal);
            font-size: var(--font-size-xs);
            font-style: italic;
            color: var(--color-text-secondary);
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
            margin-top: var(--space-6);
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <button class="btn btn--icon-only" onclick="history.back()" aria-label="Kthehu">
                <i data-lucide="arrow-left"></i>
            </button>
            <div style="text-align: right;">
                <h1 class="page-title" style="font-size: var(--font-size-xl);" id="log-prayer-name">Namazi</h1>
                <p class="page-subtitle" id="log-prayer-date">Sot</p>
            </div>
        </div>
    </header>

    <main class="page-content animate-slide-up">
        <!-- Hapi 1: Si u fale? -->
        <section class="log-section">
            <h3 class="form-label" style="margin-bottom: var(--space-3); font-size: var(--font-size-base);">🕌 Si u fale?</h3>
            
            <label class="log-option">
                <input type="radio" name="prayer_method" value="mosque_congregation" required>
                <div>
                    <strong>Në xhami me xhemat</strong>
                    <div style="font-size: var(--font-size-xs); color: var(--color-text-muted);">27 gradë më i vlefshëm</div>
                </div>
            </label>
            
            <label class="log-option">
                <input type="radio" name="prayer_method" value="home_congregation">
                <div>
                    <strong>Në shtëpi me xhemat</strong>
                    <div style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Me familjen ose miqtë</div>
                </div>
            </label>
            
            <label class="log-option">
                <input type="radio" name="prayer_method" value="alone">
                <div>
                    <strong>Vetëm</strong>
                    <div style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Individulisht në kohë</div>
                </div>
            </label>
            
            <label class="log-option">
                <input type="radio" name="prayer_method" value="qada">
                <div>
                    <strong>Kaza (Jashtë kohës)</strong>
                    <div style="font-size: var(--font-size-xs); color: var(--color-text-muted);">Zëvendësim i vonuar</div>
                </div>
            </label>
        </section>

        <!-- Hapi 2: Sunetet (Gjenerohet nga JS bazuar te namazi) -->
        <section class="log-section" id="sunnah-section" style="margin-top: var(--space-5); display: none;">
            <h3 class="form-label" style="margin-bottom: var(--space-3); font-size: var(--font-size-base);">📿 Sunetet</h3>
            <div id="sunnah-container">
                <!-- Checkboxes mbushen nga JS -->
            </div>
            <div class="hadith-quote" id="sunnah-hadith"></div>
        </section>

        <!-- Hapi 3: Shënime Opsionale -->
        <section class="log-section" style="margin-top: var(--space-5);">
            <div class="form-group">
                <label class="form-label">📝 Shënim (Opsionale)</label>
                <textarea id="prayer-note" class="form-input" rows="2" placeholder="Ku u fale? Diçka për të kujtuar..."></textarea>
            </div>
        </section>

        <!-- Veprimet -->
        <div class="action-buttons">
            <button class="btn btn--primary btn--lg" id="btn-save-dhikr">
                <i data-lucide="arrow-right"></i> Vazhdo me Dhikrin
            </button>
            <button class="btn btn--ghost btn--lg" id="btn-save-only">
                <i data-lucide="save"></i> Ruaj pa Dhikër
            </button>
        </div>
    </main>

    <script src="../js/db.js"></script>
    <script src="../js/services/prayer-times.js"></script>
    <script src="../js/modules/prayer-log.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
